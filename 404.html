<!DOCTYPE html>
<html lang="es-CL">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, follow">

<title>Página no encontrada | Cloro en Tabletas</title>

<link rel="icon" type="image/png" href="/assets/img/logo-cloro-en-tabletas.png">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*{ margin:0; padding:0; box-sizing:border-box; }

body{
  font-family:'Montserrat',sans-serif;
  background:#f1f5f9;
  color:#0a3a5f;
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

.top{
  background:#0a78c2;
  padding:18px 20px;
  display:flex;
  justify-content:center;
}

.top img{ height:56px; width:auto; }

.error-wrap{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:60px 20px;
  text-align:center;
}

.error-box{ max-width:640px; }

.error-code{
  font-size:110px;
  font-weight:900;
  line-height:1;
  color:#0a78c2;
}

.error-code span{ color:#ffb800; }

h1{
  font-size:30px;
  font-weight:900;
  margin:14px 0 12px;
}

p{
  font-size:16px;
  line-height:1.6;
  color:#4b5563;
  margin-bottom:28px;
}

.error-links{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:12px;
}

.error-links a{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:14px 24px;
  border-radius:50px;
  text-decoration:none;
  font-size:14px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.5px;
  background:#fff;
  color:#0a78c2;
  border:2px solid #0a78c2;
}

.error-links a.primary{
  background:#0a78c2;
  color:#fff;
}

@media(max-width:768px){
  .error-code{ font-size:80px; }
  h1{ font-size:22px; }
  .error-links a{ width:100%; justify-content:center; }
}
</style>

</head>
<body>

<div class="top">
  <a href="/"><img src="/assets/img/logo-cloro-en-tabletas.png" alt="Cloro en Tabletas" width="66" height="56"></a>
</div>

<main class="error-wrap">
  <div class="error-box">
    <div class="error-code">4<span>0</span>4</div>
    <h1>Esta página no existe</h1>
    <p>Puede que el enlace esté mal escrito o que la página se haya movido. Te dejamos los accesos más visitados:</p>
    <div class="error-links">
      <a href="/productos/" class="primary"><i class="fa-solid fa-cart-shopping"></i> Ver productos</a>
      <a href="/productos/cloro-en-tabletas-5-kilos/"><i class="fa-solid fa-fire"></i> Oferta 5 kilos</a>
      <a href="/blog/"><i class="fa-solid fa-newspaper"></i> Blog</a>
      <a href="/"><i class="fa-solid fa-house"></i> Inicio</a>
    </div>
  </div>
</main>

</body>
</html>
