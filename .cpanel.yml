---
# Despliegue a public_html: copia los archivos públicos del sitio y este
# .cpanel.yml (el hosting lo requiere en ambos lados).
# No se publican src/, public/, package.json, README.md ni netlify.toml.
# Si agregas una carpeta nueva al sitio, súmala a la lista.
# .htaccess no se copia a propósito: se gestiona directo en el servidor.
deployment:
  tasks:
    - export DEPLOYPATH=/home/ke53vs82b652/public_html/
    - /bin/cp .cpanel.yml index.html 404.html robots.txt sitemap.xml $DEPLOYPATH
    - /bin/cp -R assets blog productos checkout cuenta politica-devoluciones politica-privacidad $DEPLOYPATH
